<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enrollment Records — Dr. Alfredo Pio De Roda School</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f8f9fa;
      padding: 40px;
    }
    h1 {
      text-align: center;
      color: #004aad;
    }
    #searchBar {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 20px auto 30px;
      padding: 10px 14px;
      border: 2px solid #004aad;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    #searchBar:focus {
      box-shadow: 0 0 6px rgba(0,74,173,0.4);
    }
    .record {
      background: #fff;
      border-radius: 12px;
      padding: 15px 20px;
      margin-bottom: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }
    .record-header {
      display: flex;
      justify-content: space-between;
      cursor: pointer;
      font-weight: bold;
      color: #004aad;
    }
    .record-details {
      display: none;
      margin-top: 10px;
      font-size: 15px;
    }
    button.copy {
      background: #004aad;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 13px;
      margin-left: 6px;
    }
    button.copy:hover {
      background: #003580;
    }
    .delete {
      background: crimson;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Enrollment Records</h1>
  <input type="text" id="searchBar" placeholder="Search by name, grade, or control number...">
  <div id="records"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, get, remove } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAYpXaL6oNhuX3LWAinx7LmhrAozfVzCvk",
      authDomain: "dr-de-roda-lr-portal.firebaseapp.com",
      databaseURL: "https://dr-de-roda-lr-portal-default-rtdb.firebaseio.com/",
      projectId: "dr-de-roda-lr-portal",
      storageBucket: "dr-de-roda-lr-portal.firebasestorage.app",
      messagingSenderId: "1074205661200",
      appId: "1:1074205661200:web:f42d20c85f8600728cd295",
      measurementId: "G-MJF7Z2DYHS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const recordsDiv = document.getElementById("records");
    const searchBar = document.getElementById("searchBar");

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text);
      alert(`Copied: ${text}`);
    }

    function createRecordCard(grade, student, data, key) {
      const card = document.createElement("div");
      card.className = "record";
      card.dataset.search = `${student.toLowerCase()} ${grade.toLowerCase()} ${(data.controlNo || "").toLowerCase()}`;

      card.innerHTML = `
        <div class="record-header">${student} — ${grade}</div>
        <div class="record-details">
          <p><b>Parent:</b> ${data.parent} <button class="copy" onclick="copyToClipboard('${data.parent}')">Copy</button></p>
          <p><b>Email:</b> ${data.email} <button class="copy" onclick="copyToClipboard('${data.email}')">Copy</button></p>
          <p><b>Phone:</b> ${data.phone} <button class="copy" onclick="copyToClipboard('${data.phone}')">Copy</button></p>
          <p><b>Grade Level:</b> ${grade} <button class="copy" onclick="copyToClipboard('${grade}')">Copy</button></p>
          <p><b>LRN:</b> ${data.lrn} <button class="copy" onclick="copyToClipboard('${data.lrn}')">Copy</button></p>
          <p><b>Control No.:</b> ${data.controlNo || "—"} <button class="copy" onclick="copyToClipboard('${data.controlNo || ""}')">Copy</button></p>
          <button class="delete" onclick="deleteRecord('${grade}', '${key}', this)">Delete</button>
        </div>
      `;
      card.querySelector(".record-header").addEventListener("click", () => {
        const details = card.querySelector(".record-details");
        details.style.display = details.style.display === "block" ? "none" : "block";
      });
      recordsDiv.appendChild(card);
    }

    async function loadRecords() {
      const grades = ["Kinder", "G1", "G2", "G3", "G4", "G5", "G6"];
      for (const grade of grades) {
        const snap = await get(ref(db, `enrollments/${grade}`));
        if (snap.exists()) {
          const data = snap.val();
          Object.keys(data).forEach((key) => {
            createRecordCard(grade, key, data[key], key);
          });
        }
      }
    }

    window.copyToClipboard = copyToClipboard;

    async function deleteRecord(grade, key, button) {
      if (confirm("Delete this record?")) {
        await remove(ref(db, `enrollments/${grade}/${key}`));
        button.closest(".record").remove();
        alert("Record deleted successfully!");
      }
    }

    searchBar.addEventListener("input", () => {
      const term = searchBar.value.toLowerCase();
      const cards = document.querySelectorAll(".record");
      cards.forEach(card => {
        card.style.display = card.dataset.search.includes(term) ? "block" : "none";
      });
    });

    loadRecords();
  </script>
</body>
</html>
